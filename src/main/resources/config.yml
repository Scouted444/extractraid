      - "STICK:2-8:8"
      - "OAK_PLANKS:4-16:8"
      - "WOODEN_SWORD:1:7"
      - "STONE_SWORD:1:5"
      - "STONE_AXE:1:4"
      - "LEATHER_HELMET:1:5"
      - "LEATHER_CHESTPLATE:1:4"
      - "LEATHER_LEGGINGS:1:4"
      - "LEATHER_BOOTS:1:5"
      - "IRON_NUGGET:3-9:6"
  military:
