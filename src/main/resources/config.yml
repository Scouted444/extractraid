# ExtractRaid configuration
# Hub location, extraction zones, loot chests and spawn points are NOT stored here.
# They are saved in plugins/ExtractRaid/map.yml via /raidadmin commands.

# Folder name (in the server root) of the raid map that gets copied for every raid.
# Raid copies are named xr_1, xr_2, ... and are deleted when the raid ends.
template-world: raid_template

queue:
  min-players: 2          # set to 1 while testing alone
  max-players: 16
  countdown-seconds: 30   # countdown starts once min-players is reached

raid:
  duration-seconds: 1200            # 20 minutes. Anyone still inside at the end is MIA (loses gear).
  extract-open-after-seconds: 120   # extraction zones are inactive until then
  extract-hold-seconds: 10          # time you must stand in a zone to extract
  active-extract-points: 3          # how many of the registered zones are active per raid (random)
  reveal-extract-coords: true       # print active zone names and coordinates when they open
  spawn-protection-seconds: 10
  start-time: 0                     # world time at raid start (0 = sunrise). 20 min = 1 full day/night cycle.
  difficulty: NORMAL
  allow-building: false             # false = no breaking or placing blocks in raids and hub

  border:
    center-x: 0
    center-z: 0
    start-size: 500                 # diameter in blocks
    damage-per-block: 2.0           # damage per second per block outside the border
    # "start-second:new-size:shrink-seconds"
    phases:
      - "300:300:180"
      - "660:150:180"
      - "960:60:150"

  # Mobs placed at random surface positions at raid start ("ENTITY_TYPE:count").
  # Husks and spiders are used because they do not burn in daylight.
  mobs:
    - "HUSK:30"
    - "SPIDER:12"
    - "CREEPER:8"
    - "PILLAGER:8"
    - "WITCH:3"

  # Gear given on /raid scav ("MATERIAL:amount"). Armor pieces are auto-equipped.
  scav-kit:
    - "WOODEN_SWORD:1"
    - "LEATHER_HELMET:1"
    - "LEATHER_CHESTPLATE:1"
    - "BREAD:3"
    - "TORCH:6"

stash:
  rows: 6   # 1-6. Do not lower this after players have stored items.

# Loot tables. Item format: "MATERIAL:amount:weight" (amount can be a range like 2-6).
# "rolls" is how many item stacks go into a chest.
# Register a chest with /raidadmin addloot [table] while looking at it in the template world.
loot-tables:
  common:
    rolls: "2-5"
    items:
      - "BREAD:1-4:20"
      - "COOKED_PORKCHOP:1-3:14"
      - "APPLE:1-3:14"
      - "ARROW:4-12:12"
