    items:
      - "COOKED_BEEF:2-6:16"
      - "GOLDEN_CARROT:2-5:10"
      - "ARROW:8-24:12"
      - "BOW:1:6"
      - "CROSSBOW:1:5"
      - "SHIELD:1:6"
      - "IRON_SWORD:1:7"
      - "IRON_AXE:1:4"
